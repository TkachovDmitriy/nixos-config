name: Nix CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint and evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci .

      - name: Run Statix
        shell: bash
        run: |
          # Capture diagnostics from stdout, while leaving Nix download logs on
          # stderr. Treat any Statix diagnostic as a CI failure.
          output="$(nix run nixpkgs#statix -- check --format errfmt .)"
          if [[ -n "$output" ]]; then
            printf '%s\n' "$output"
            exit 1
          fi

      - name: Run Deadnix
        run: nix run nixpkgs#deadnix -- --fail --no-lambda-pattern-names .

      - name: Evaluate flake
        run: nix flake check --no-build
